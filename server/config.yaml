# Aether Server — Default Configuration
#
# Loading priority: -config flag > env vars (AETHER_*) > this file > defaults.
# Sensitive values (passwords) should come from env vars, NOT this file.

service:
  name: "aether-server"
  version: "0.1.0"
  env: "dev"

server:
  addr: ":8080"
  timeout: "30s"

log_level: "info"

data:
  database:
    driver: "postgres"
    host: "192.168.31.33"        # dev PG (aether-postgres container)
    port: 5433
    user: "aether"
    database: "aether_dev"
    ssl_mode: "disable"
    max_conns: 10
    timeout: "5s"
    # password: set via AETHER_DATA_DATABASE_PASSWORD (sensitive)
  redis:
    addr: ""                     # empty = Redis disabled

connect:
  enabled: true

otel:
  endpoint: ""                   # empty = noop; set to collector addr in prod
  service_name: "aether-server"
