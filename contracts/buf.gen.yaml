version: v2
plugins:
  # Go Connect service stubs → server/internal/proto/ (same package as pb.go)
  - local: protoc-gen-connect-go
    out: ../server/internal/proto
    opt:
      - paths=source_relative
  # Go message types (pb.go) → server/internal/proto/
  - local: protoc-gen-go
    out: ../server/internal/proto
    opt:
      - paths=source_relative
  # TypeScript message types → web/src/gen/ (W5 integration)
  - remote: buf.build/bufbuild/es
    out: ../web/src/gen
    opt:
      - target=ts
      - import_extension=js
  # TypeScript Connect-ES service stubs → web/src/gen/ (W5 integration)
  - remote: buf.build/connectrpc/es
    out: ../web/src/gen
    opt:
      - target=ts
      - import_extension=js
