version: v2
modules:
  - path: .
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - DEFAULT
  except:
    # Allow platform/v1/ directory for aether.platform.v1 package — directory
    # uses a short name; the Go import path is governed by go_package.
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
