syntax = "proto3";

package aether.platform.v1;

import "platform/v1/common.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// CatalogService — Service catalog (module marketplace).
// Users browse catalog items to find what to request.
// ============================================================
service CatalogService {
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {}
  rpc GetCatalogItem(GetCatalogItemRequest) returns (GetCatalogItemResponse) {}
}

message CatalogItem {
  string id = 1;                        // cat_<alphanum>
  string name = 2;
  string description = 3;
  string category = 4;

  enum CatalogItemStatus {
    CATALOG_ITEM_STATUS_UNSPECIFIED = 0;
    CATALOG_ITEM_STATUS_ACTIVE = 1;
    CATALOG_ITEM_STATUS_DEPRECATED = 2;
  }
  CatalogItemStatus status = 5;

  ModuleVersion module_version = 6;     // from common.proto
  string form_schema_json = 7;          // JSON Schema 2020-12 for request form (D40)
  map<string, string> default_tags = 8; // platform tags injected by codegen (D18)
}

message ListItemsRequest {
  int32 page_size = 1;
  string page_token = 2;
  CatalogItem.CatalogItemStatus status_filter = 3;
}

message ListItemsResponse {
  repeated CatalogItem items = 1;
  string next_page_token = 2;
}

message GetCatalogItemRequest {
  string catalog_item_id = 1;           // cat_<alphanum>
}

message GetCatalogItemResponse {
  CatalogItem item = 1;
}
