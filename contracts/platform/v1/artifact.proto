syntax = "proto3";

package aether.platform.v1;

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// ArtifactService — Plan artifact metadata.
// ============================================================
service ArtifactService {
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse) {}
}

message PlanArtifact {
  string id = 1;                    // art_<alphanum>
  string request_id = 2;

  enum ArtifactStatus {
    ARTIFACT_STATUS_UNSPECIFIED = 0;
    ARTIFACT_STATUS_READY = 1;
    ARTIFACT_STATUS_EXPIRED = 2;
    ARTIFACT_STATUS_CONSUMED = 3;
  }
  ArtifactStatus status = 3;

  string plan_hash = 4;             // sha256:<hex>
  PlanSummary summary = 5;
  int64 cost_estimate_cents = 6;
  string storage_uri = 7;           // object storage URI (not temp URL)
  string expires_at = 8;            // RFC 3339 UTC
  string created_at = 9;
}

message PlanSummary {
  int32 resources_to_add = 1;
  int32 resources_to_change = 2;
  int32 resources_to_destroy = 3;
}

message GetArtifactRequest {
  string artifact_id = 1;
}

message GetArtifactResponse {
  PlanArtifact artifact = 1;
  string correlation_id = 2;
}
