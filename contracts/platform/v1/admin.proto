syntax = "proto3";

package aether.platform.v1;

import "platform/v1/common.proto";
import "platform/v1/catalog.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// ModuleRegistryService — 管理员注册原子模块（D7）。
// 管理员从 Git 拉取 Terraform 模块，解析 variables.tf 生成
// variables_contract_json，校验后注册到平台模块库。
// 需要 admin 角色。
// ============================================================
service ModuleRegistryService {
  // 注册一个新模块或新版本。
  rpc RegisterModule(RegisterModuleRequest) returns (RegisterModuleResponse) {}
  // 列出已注册的模块（支持按 provider/status 过滤）。
  rpc ListModules(ListModulesRequest) returns (ListModulesResponse) {}
  // 查询单个模块的详情（含 variables contract）。
  rpc GetModule(GetModuleRequest) returns (GetModuleResponse) {}
  // 废弃一个模块版本。
  rpc DeprecateModule(DeprecateModuleRequest) returns (DeprecateModuleResponse) {}
}

// ============================================================
// CatalogAdminService — 管理员发布/管理服务目录项（D25）。
// 从已注册的模块版本裁剪 form_schema、设置默认值、配置可见性
// 和 cardinality（single/list/map），发布为用户可申请的目录项。
// 需要 admin 角色。
// ============================================================
service CatalogAdminService {
  // 从模块版本发布一个目录项。
  rpc PublishCatalogItem(PublishCatalogItemRequest) returns (PublishCatalogItemResponse) {}
  // 更新目录项（默认值/可见性/cardinality）。
  rpc UpdateCatalogItem(UpdateCatalogItemRequest) returns (UpdateCatalogItemResponse) {}
  // 废弃一个目录项（用户不可见，已有申请继续走）。
  rpc DeprecateCatalogItem(DeprecateCatalogItemRequest) returns (DeprecateCatalogItemResponse) {}
}

// ============================================================
// Module Messages
// ============================================================

message Module {
  string id = 1;                            // mod_<alphanum>
  string name = 2;
  string description = 3;
  string git_source = 4;                    // e.g. github.com/org/modules/ecs
  string provider = 5;                      // aws / alicloud / azure / gcp

  enum ModuleStatus {
    MODULE_STATUS_UNSPECIFIED = 0;
    MODULE_STATUS_PENDING_VALIDATION = 1;
    MODULE_STATUS_VALIDATED = 2;
    MODULE_STATUS_VALIDATION_FAILED = 3;
    MODULE_STATUS_DEPRECATED = 4;
  }
  ModuleStatus status = 6;

  repeated ModuleVersion versions = 7;      // 所有已注册版本
  string created_at = 8;                    // RFC 3339 UTC
  string updated_at = 9;
}


// 模块依赖声明（从 variables.tf 的 validation/description 提取）
message ModuleDependency {
  string variable_name = 1;                 // e.g. "vswitch_id"
  string description = 2;                   // e.g. "ECS 所在交换机 ID（来自网络层）"
  string depends_on_layer = 3;              // e.g. "global"（依赖哪一层）
  string depends_on_module = 4;             // e.g. "vpc"（依赖哪个模块）
  string output_key = 5;                    // e.g. "vswitch_id"（从上游 outputs 取哪个值）
  bool required = 6;                        // 是否必填
}

// ============================================================
// ModuleRegistry RPC Messages
// ============================================================

message RegisterModuleRequest {
  string git_source = 1;                    // Git 仓库地址
  string module_path = 2;                   // 模块在仓库内的路径（e.g. atomic/ecs）
  string version = 3;                       // 要注册的版本（tag 或 commit）
  string provider = 4;                      // 云提供商
  string name = 5;                          // 模块显示名
  string description = 6;
}

message RegisterModuleResponse {
  Module module = 1;
}

message ListModulesRequest {
  PageRequest pagination = 1;
  string provider_filter = 2;
  Module.ModuleStatus status_filter = 3;
}

message ListModulesResponse {
  repeated Module modules = 1;
  PageResponse pagination = 2;
}

message GetModuleRequest {
  string module_id = 1;                     // mod_<alphanum>
}

message GetModuleResponse {
  Module module = 1;
}

message DeprecateModuleRequest {
  string module_id = 1;
  string version = 2;                       // 要废弃的具体版本
  string reason = 3;
}

message DeprecateModuleResponse {
  Module module = 1;
}

// ============================================================
// CatalogAdmin RPC Messages
// ============================================================

message PublishCatalogItemRequest {
  string module_id = 1;                     // 从哪个模块发布
  string module_version = 2;                // 模块的哪个版本
  string name = 3;                          // 目录项显示名
  string description = 4;
  string category = 5;                      // e.g. "compute" / "database" / "network"

  enum Cardinality {
    CARDINALITY_UNSPECIFIED = 0;
    CARDINALITY_SINGLE = 1;                 // 单实例
    CARDINALITY_LIST = 2;                   // count = N
    CARDINALITY_MAP = 3;                    // for_each = tomap({...})
  }
  Cardinality cardinality = 6;
  string instance_key = 7;                  // for_each 的 key 变量名
  repeated string per_instance_fields = 8;  // 每实例不同的变量
  repeated string shared_fields = 9;        // 所有实例共享的变量

  string form_schema_json = 10;             // 从 variables contract 裁剪的表单 schema
  map<string, string> default_values = 11;  // 最佳实践默认值
  repeated string visible_to_teams = 12;    // 可见性控制（空=全部可见）
  string layer_logical_id = 13;            // 该目录项属于哪一层（global/middleware/application）
  map<string, string> default_tags = 14;    // 平台强制 tag（D18）
}

message PublishCatalogItemResponse {
  CatalogItem item = 1;
}

message UpdateCatalogItemRequest {
  string catalog_item_id = 1;               // cat_<alphanum>
  map<string, string> default_values = 2;
  repeated string visible_to_teams = 3;
  string form_schema_json = 4;              // 可更新表单 schema
  map<string, string> default_tags = 5;
}

message UpdateCatalogItemResponse {
  CatalogItem item = 1;
}

message DeprecateCatalogItemRequest {
  string catalog_item_id = 1;
  string reason = 2;
}

message DeprecateCatalogItemResponse {
  CatalogItem item = 1;
}
