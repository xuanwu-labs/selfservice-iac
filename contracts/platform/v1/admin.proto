syntax = "proto3";

package aether.platform.v1;

import "platform/v1/common.proto";
import "platform/v1/catalog.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// ModuleRegistryService — Admin: register atomic modules (D7).
// Admins pull Terraform modules from Git, parse variables.tf to
// generate variables_contract_json, validate, and register to the
// platform module registry. Requires admin role.
// ============================================================
service ModuleRegistryService {
  // Register a new module or a new version.
  rpc RegisterModule(RegisterModuleRequest) returns (RegisterModuleResponse) {}
  // List registered modules (filter by provider/status).
  rpc ListModules(ListModulesRequest) returns (ListModulesResponse) {}
  // Get module details (includes variables contract).
  rpc GetModule(GetModuleRequest) returns (GetModuleResponse) {}
  // Deprecate a module version.
  rpc DeprecateModule(DeprecateModuleRequest) returns (DeprecateModuleResponse) {}
}

// ============================================================
// CatalogAdminService — Admin: publish and manage catalog items (D25).
// Create user-facing catalog items from registered module versions:
// trim form_schema, set defaults, configure visibility and
// cardinality (single/list/map). Requires admin role.
// ============================================================
service CatalogAdminService {
  // Publish a catalog item from a module version.
  rpc PublishCatalogItem(PublishCatalogItemRequest) returns (PublishCatalogItemResponse) {}
  // Update a catalog item (defaults/visibility/cardinality).
  rpc UpdateCatalogItem(UpdateCatalogItemRequest) returns (UpdateCatalogItemResponse) {}
  // Deprecate a catalog item (hidden from users; existing requests continue).
  rpc DeprecateCatalogItem(DeprecateCatalogItemRequest) returns (DeprecateCatalogItemResponse) {}
}

// ============================================================
// Module Messages
// ============================================================

message Module {
  string id = 1;                            // mod_<alphanum>
  string name = 2;
  string description = 3;
  string git_source = 4;                    // e.g. github.com/org/modules/ecs
  string provider = 5;                      // aws / alicloud / azure / gcp

  enum ModuleStatus {
    MODULE_STATUS_UNSPECIFIED = 0;
    MODULE_STATUS_PENDING_VALIDATION = 1;
    MODULE_STATUS_VALIDATED = 2;
    MODULE_STATUS_VALIDATION_FAILED = 3;
    MODULE_STATUS_DEPRECATED = 4;
  }
  ModuleStatus status = 6;

  repeated ModuleVersion versions = 7;      // all registered versions
  string created_at = 8;                    // RFC 3339 UTC
  string updated_at = 9;
}

// ModuleDependency declares a cross-module dependency (parsed from variables.tf).
// Example: ECS module depends on VPC module's vswitch_id output.
message ModuleDependency {
  string variable_name = 1;                 // e.g. "vswitch_id"
  string description = 2;                   // e.g. "VSwitch ID for the ECS instance"
  string depends_on_layer = 3;              // e.g. "global"
  string depends_on_module = 4;             // e.g. "vpc"
  string output_key = 5;                    // e.g. "vswitch_id"
  bool required = 6;                        // whether this dependency is mandatory
}

// ============================================================
// ModuleRegistry RPC Messages
// ============================================================

message RegisterModuleRequest {
  string git_source = 1;                    // Git repository URL
  string module_path = 2;                   // path within repo (e.g. atomic/ecs)
  string version = 3;                       // tag or commit to register
  string provider = 4;                      // cloud provider
  string name = 5;                          // display name
  string description = 6;
}

message RegisterModuleResponse {
  Module module = 1;
}

message ListModulesRequest {
  PageRequest pagination = 1;
  string provider_filter = 2;
  Module.ModuleStatus status_filter = 3;
}

message ListModulesResponse {
  repeated Module modules = 1;
  PageResponse pagination = 2;
}

message GetModuleRequest {
  string module_id = 1;                     // mod_<alphanum>
}

message GetModuleResponse {
  Module module = 1;
}

message DeprecateModuleRequest {
  string module_id = 1;
  string version = 2;                       // specific version to deprecate
  string reason = 3;
}

message DeprecateModuleResponse {
  Module module = 1;
}

// ============================================================
// CatalogAdmin RPC Messages
// ============================================================

message PublishCatalogItemRequest {
  string module_id = 1;                     // source module
  string module_version = 2;                // which version to publish
  string name = 3;                          // catalog item display name
  string description = 4;
  string category = 5;                      // e.g. "compute" / "database" / "network"

  enum Cardinality {
    CARDINALITY_UNSPECIFIED = 0;
    CARDINALITY_SINGLE = 1;                 // single instance
    CARDINALITY_LIST = 2;                   // count = N
    CARDINALITY_MAP = 3;                    // for_each = tomap({...})
  }
  Cardinality cardinality = 6;
  string instance_key = 7;                  // for_each key variable name
  repeated string per_instance_fields = 8;  // fields that differ per instance
  repeated string shared_fields = 9;        // fields shared across instances

  string form_schema_json = 10;             // trimmed form schema (from variables contract)
  map<string, string> default_values = 11;  // best-practice defaults
  repeated string visible_to_teams = 12;    // visibility control (empty = all)
  string layer_logical_id = 13;            // which layer (global/middleware/application)
  map<string, string> default_tags = 14;    // platform-mandated tags (D18)
}

message PublishCatalogItemResponse {
  CatalogItem item = 1;
}

message UpdateCatalogItemRequest {
  string catalog_item_id = 1;               // cat_<alphanum>
  map<string, string> default_values = 2;
  repeated string visible_to_teams = 3;
  string form_schema_json = 4;              // updated form schema
  map<string, string> default_tags = 5;
}

message UpdateCatalogItemResponse {
  CatalogItem item = 1;
}

message DeprecateCatalogItemRequest {
  string catalog_item_id = 1;
  string reason = 2;
}

message DeprecateCatalogItemResponse {
  CatalogItem item = 1;
}
