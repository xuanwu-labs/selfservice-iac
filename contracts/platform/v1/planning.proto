syntax = "proto3";

package aether.platform.v1;

import "platform/v1/request.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// PlanningService — Terraform plan generation.
// Triggered after codegen completes; produces a saved plan artifact.
// ============================================================
service PlanningService {
  rpc StartPlan(StartPlanRequest) returns (StartPlanResponse) {}
}

message StartPlanRequest {
  string request_id = 1;
}

message StartPlanResponse {
  Request request = 1;              // updated request with status=planning
  string correlation_id = 2;
}
