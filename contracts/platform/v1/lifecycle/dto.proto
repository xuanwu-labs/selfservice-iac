syntax = "proto3";

package aether.platform.v1.lifecycle;

import "platform/v1/common/dto.proto";
import "platform/v1/common/enum.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/lifecycle;lifecyclev1";

// ============================================================
// Lifecycle messages — domain objects + RPC request/response.
// All messages for this domain live here. srv.proto has only service defs.
// ============================================================

// --- Domain Objects ---

message LifecycleRequest {
  string id = 1;
  aether.platform.v1.common.RequestStatus status = 2;
  string catalog_item_id = 3;
  string env_id = 4;
  string team_id = 5;
  string tenant_id = 6;
  string bundle_id = 7;
  map<string, string> form_values = 8;
  string form_hash = 9;
  aether.platform.v1.common.RequestSource source = 10;
  string pinned_commit = 11;
  string plan_artifact_id = 12;
  int64 cost_estimate_cents = 13;
  string cost_currency = 14;
  string created_at = 15;
  string updated_at = 16;
  int32 version = 17;
  string correlation_id = 18;
  // requester_id: the identity that submitted the request. Required for
  // "my requests" queries and approver-side attribution (docs/04 §2.4).
  string requester_id = 19;
  // current_stage: human-readable pipeline stage within the current
  // status (e.g. "codegen", "plan", "apply"). Coarse-grained UI hint;
  // the authoritative state is `status` + `version` (docs/00 GetRequest).
  string current_stage = 20;
}

message LifecycleEvent {
  string id = 1;
  string request_id = 2;
  string event_type = 3;
  aether.platform.v1.common.Actor actor = 4;
  string occurred_at = 5;
  string correlation_id = 6;
}

message PlanArtifact {
  string id = 1;
  string request_id = 2;
  aether.platform.v1.common.ArtifactStatus status = 3;
  string plan_hash = 4;
  PlanSummary summary = 5;
  int64 cost_estimate_cents = 6;
  string storage_uri = 7;
  string expires_at = 8;
  string created_at = 9;
}

message PlanSummary {
  int32 resources_to_add = 1;
  int32 resources_to_change = 2;
  int32 resources_to_destroy = 3;
}

message GateResult {
  string gate_id = 1;
  bool passed = 2;
  string policy = 3;
  string message = 4;
  aether.platform.v1.common.GateSeverity severity = 5;
}

message ApprovalRun {
  string run_id = 1;
  aether.platform.v1.common.ApprovalRunStatus status = 2;
  string decided_by = 3;
  string decided_at = 4;
  // request_id: the request this run belongs to. Approvers navigate
  // from a run back to the request detail (docs/04 §2.10).
  string request_id = 5;
  // gate: which of the two mandatory gates this run is for (D21).
  // pre-plan = admission; pre-apply = execution confirmation.
  aether.platform.v1.common.ApprovalGate gate = 6;
  // current_node: the flow node currently awaiting decision
  // (docs/12 §7 node-chain visualization).
  string current_node = 7;
  string started_at = 8;
  string finished_at = 9;
  // expires_at: when the run (or its current node) times out and
  // escalates / auto-rejects (docs/12 §2.3 on_timeout).
  string expires_at = 10;
}

// ApprovalNodeRun is the runtime state of one node within an approval
// run (docs/04 §2.10 approval_node_runs). Drives the countersign
// progress UI (decided_count / required_count).
message ApprovalNodeRun {
  string node_id = 1;
  aether.platform.v1.common.ApprovalNodeMode mode = 2;
  int32 decided_count = 3;
  int32 required_count = 4;
  aether.platform.v1.common.ApprovalNodeStatus status = 5;
  string timeout_at = 6;
}

// ApprovalDecisionRecord is one approver's decision on a node
// (docs/04 §2.10 approval_decisions). The audit trail within a run.
message ApprovalDecisionRecord {
  string approver_id = 1;
  aether.platform.v1.common.ApprovalDecision decision = 2;
  string comment = 3;
  string decided_at = 4;
}

// --- RPC: CreateRequest ---

message CreateRequestRequest {
  string catalog_item_id = 1;
  string env_id = 2;
  string team_id = 3;
  string tenant_id = 4;
  string bundle_id = 5;
  map<string, string> form_values = 6;
  aether.platform.v1.common.RequestSource source = 7;
  map<string, string> source_context = 8;
}

message CreateRequestResponse {
  LifecycleRequest request = 1;
  string correlation_id = 2;
}

// --- RPC: GetRequest ---

message GetRequestRequest {
  string request_id = 1;
}

message GetRequestResponse {
  LifecycleRequest request = 1;
  string correlation_id = 2;
}

// --- RPC: ListRequestEvents ---

message ListRequestEventsRequest {
  string request_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListRequestEventsResponse {
  repeated LifecycleEvent events = 1;
  string next_page_token = 2;
  string correlation_id = 3;
}

// --- RPC: CancelRequest ---

message CancelRequestRequest {
  string request_id = 1;
  int32 expected_version = 2;
  string reason = 3;
}

message CancelRequestResponse {
  LifecycleRequest request = 1;
  string correlation_id = 2;
}

// --- RPC: StartPlan ---

message StartPlanRequest {
  string request_id = 1;
}

message StartPlanResponse {
  LifecycleRequest request = 1;
  string correlation_id = 2;
}

// --- RPC: GetArtifact ---

message GetArtifactRequest {
  string artifact_id = 1;
}

message GetArtifactResponse {
  PlanArtifact artifact = 1;
  string correlation_id = 2;
}

// --- RPC: EvaluateGate ---

message EvaluateGateRequest {
  string request_id = 1;
}

message EvaluateGateResponse {
  string request_id = 1;
  bool passed = 2;
  repeated GateResult gates = 3;
  string correlation_id = 4;
}

// --- RPC: DecideApproval ---

message DecideApprovalRequest {
  string run_id = 1;
  aether.platform.v1.common.ApprovalDecision decision = 2;
  string comment = 3;
  int32 expected_run_version = 4;
}

message DecideApprovalResponse {
  ApprovalRun run = 1;
  string correlation_id = 2;
}

// --- RPC: StartApply ---

message StartApplyRequest {
  string request_id = 1;
}

message StartApplyResponse {
  string correlation_id = 1;
}

// --- RPC: ListRequests ---

message ListRequestsRequest {
  // Filters. All optional; unset fields match everything.
  string requester_id = 1;
  string team_id = 2;
  repeated aether.platform.v1.common.RequestStatus status_filter = 3;
  string catalog_item_id = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListRequestsResponse {
  repeated LifecycleRequest requests = 1;
  string next_page_token = 2;
  string correlation_id = 3;
}

// --- RPC: ListPendingApprovals ---

message ListPendingApprovalsRequest {
  // approver_id: the identity asking for their queue. The server
  // resolves approver_id -> role_bindings to find runs whose current
  // node is routed to one of the caller's (team, role) pairs
  // (docs/12 §2.3 node binds role, not person).
  string approver_id = 1;
  // Optional narrowers.
  aether.platform.v1.common.ApprovalGate gate_filter = 2;
  string team_id = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ListPendingApprovalsResponse {
  repeated ApprovalRun runs = 1;
  string next_page_token = 2;
  string correlation_id = 3;
}

// --- RPC: GetApprovalRun ---

message GetApprovalRunRequest {
  string run_id = 1;
}

message GetApprovalRunResponse {
  ApprovalRun run = 1;
  // nodes: the full node chain of the flow, with runtime progress
  // (docs/12 §7 frontend node-chain rendering).
  repeated ApprovalNodeRun nodes = 2;
  // decisions: the audit trail of decisions recorded so far.
  repeated ApprovalDecisionRecord decisions = 3;
  string correlation_id = 4;
}
