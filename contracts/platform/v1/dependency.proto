syntax = "proto3";

package aether.platform.v1;

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// DependencyService — Dependency query.
// When a user submits a request, they may need to select upstream
// dependencies (e.g. ECS depends on VPC's vswitch_id). This service
// queries available upstream stacks for the frontend dependency picker.
// Dependency info comes from ModuleVersion.dependencies (parsed from
// variables.tf).
// ============================================================
service DependencyService {
  // List dependencies declared by a module version.
  // Frontend uses this to render dependency selectors (e.g. "Select VPC").
  rpc ListModuleDependencies(ListModuleDependenciesRequest) returns (ListModuleDependenciesResponse) {}

  // List available upstream stacks for a dependency.
  // e.g. if the dependency is on the VPC module in layer "global",
  // returns all existing VPC stacks the user's team can reference.
  // These stacks' outputs are injected via terraform_remote_state in codegen.
  rpc ListAvailableStacks(ListAvailableStacksRequest) returns (ListAvailableStacksResponse) {}
}

// ============================================================
// Messages
// ============================================================

// ModuleDependencyInfo describes one dependency and its available upstream stacks.
message ModuleDependencyInfo {
  string variable_name = 1;                 // e.g. "vswitch_id"
  string description = 2;                   // e.g. "VSwitch ID for the ECS instance"
  string depends_on_layer = 3;              // e.g. "global"
  string depends_on_module = 4;             // e.g. "vpc"
  string output_key = 5;                    // e.g. "vswitch_id"
  bool required = 6;
  repeated AvailableStack available_stacks = 7; // existing upstream stacks for selection
}

// AvailableStack is an existing upstream stack the user can select as a dependency.
// Its outputs are referenced via terraform_remote_state in the generated code.
message AvailableStack {
  string stack_id = 1;                      // stk_<alphanum>
  string display_name = 2;                  // e.g. "dev-global-vpc"
  string env_id = 3;                        // e.g. "dev"
  string team_id = 4;
  string layer = 5;                         // e.g. "global"
  string module_name = 6;                   // e.g. "vpc"
  map<string, string> outputs_summary = 7;  // key output previews (e.g. {vpc_id: "vpc-xxx"})
  string last_synced_at = 8;                // CMDB last sync time
}

// ============================================================
// RPC Messages
// ============================================================

message ListModuleDependenciesRequest {
  string module_id = 1;
  string module_version = 2;
  string env_id = 3;                        // environment context (some deps filtered by env)
  string team_id = 4;                       // team context (can only see own team's upstream stacks)
}

message ListModuleDependenciesResponse {
  repeated ModuleDependencyInfo dependencies = 1;
}

message ListAvailableStacksRequest {
  string layer = 1;                         // which layer's stacks (e.g. "global")
  string module_name = 2;                   // which module's stacks (e.g. "vpc")
  string env_id = 3;
  string team_id = 4;
}

message ListAvailableStacksResponse {
  repeated AvailableStack stacks = 1;
}
