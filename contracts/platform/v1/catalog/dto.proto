syntax = "proto3";

package aether.platform.v1.catalog;

import "platform/v1/common/enum.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/catalog;catalogv1";

// ============================================================
// Catalog DTOs — catalog item, module, dependency, stack.
// ============================================================

message CatalogItem {
  string id = 1;                        // cat_<alphanum>
  string name = 2;
  string description = 3;
  string category = 4;
  aether.platform.v1.common.CatalogItemStatus status = 5;
  ModuleVersion module_version = 6;
  string form_schema_json = 7;          // JSON Schema 2020-12 (D40)
  map<string, string> default_tags = 8; // platform tags (D18)
}

message ModuleVersion {
  string version = 1;                   // semver e.g. v1.2.0
  string commit_sha = 2;                // sha256:<hex>
  repeated string providers = 3;        // e.g. ["aws@>=5.0"]
  string variables_contract_json = 4;   // parsed from variables.tf
  repeated ModuleDependency dependencies = 5;
  string registered_at = 6;
}

message ModuleDependency {
  string variable_name = 1;             // e.g. "vswitch_id"
  string description = 2;
  string depends_on_layer = 3;          // e.g. "global"
  string depends_on_module = 4;         // e.g. "vpc"
  string output_key = 5;                // e.g. "vswitch_id"
  bool required = 6;
}

message Module {
  string id = 1;                        // mod_<alphanum>
  string name = 2;
  string description = 3;
  string git_source = 4;
  string provider = 5;
  aether.platform.v1.common.ModuleStatus status = 6;
  repeated ModuleVersion versions = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ModuleDependencyInfo {
  string variable_name = 1;
  string description = 2;
  string depends_on_layer = 3;
  string depends_on_module = 4;
  string output_key = 5;
  bool required = 6;
  repeated AvailableStack available_stacks = 7;
}

message AvailableStack {
  string stack_id = 1;                  // stk_<alphanum>
  string display_name = 2;
  string env_id = 3;
  string team_id = 4;
  string layer = 5;
  string module_name = 6;
  map<string, string> outputs_summary = 7;
  string last_synced_at = 8;
}
