syntax = "proto3";

package aether.platform.v1.catalog;

import "platform/v1/catalog/dto.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/catalog;catalogv1";

// ============================================================
// Server services — user-facing.
// ============================================================
service CatalogService {
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {}
  rpc GetCatalogItem(GetCatalogItemRequest) returns (GetCatalogItemResponse) {}
  rpc ListModuleDependencies(ListModuleDependenciesRequest) returns (ListModuleDependenciesResponse) {}
  rpc ListAvailableStacks(ListAvailableStacksRequest) returns (ListAvailableStacksResponse) {}
}

// ============================================================
// Admin services — operator-facing (requires admin role).
//
// CatalogAdmin manages the service-catalog items published from
// registered module versions. Module registration itself lives in
// the registry domain (RegistryAdminService).
// ============================================================
service CatalogAdminService {
  rpc PublishCatalogItem(PublishCatalogItemRequest) returns (PublishCatalogItemResponse) {}
  rpc UpdateCatalogItem(UpdateCatalogItemRequest) returns (UpdateCatalogItemResponse) {}
  rpc DeprecateCatalogItem(DeprecateCatalogItemRequest) returns (DeprecateCatalogItemResponse) {}
}
