syntax = "proto3";

package aether.platform.v1.registry;

import "platform/v1/common/dto.proto";
import "platform/v1/common/enum.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/registry;registryv1";

// ============================================================
// Registry messages — Terraform module registry domain objects
// + RPC request/response.
//
// This domain owns the lifecycle of atomic Terraform modules: a
// module is registered from a git source, validated, and versioned.
// The service catalog (catalog domain) publishes user-facing items
// derived from a registered module version. ModuleDependency here is
// the provider-side contract declared at registration time; the
// catalog domain's ModuleDependencyInfo / AvailableStack are the
// resolved, consumer-side views built on top of it.
// ============================================================

// --- Domain Objects ---

message Module {
  string id = 1;
  string name = 2;
  string description = 3;
  string git_source = 4;
  string provider = 5;
  aether.platform.v1.common.ModuleStatus status = 6;
  repeated ModuleVersion versions = 7;
  string created_at = 8;
  string updated_at = 9;
  // module_path: subdir within the git repo (e.g. "atomic/rds"). Empty = root.
  // Maps to modules.module_path column (DB NOT NULL DEFAULT '').
  string module_path = 10;
  // owner_team_id: team responsible for this module. Maps to
  // modules.owner_team_id (DB NOT NULL). Required at registration.
  string owner_team_id = 11;
}

message ModuleVersion {
  string version = 1;
  string commit_sha = 2;
  repeated string providers = 3;
  string variables_contract_json = 4;
  repeated ModuleDependency dependencies = 5;
  string registered_at = 6;
}

// ModuleDependency is the provider-declared cross-layer dependency
// contract extracted from a module at registration time (D25 zero
// intrusion: the module declares outputs/variables; the platform reads
// them without modifying the module).
message ModuleDependency {
  string variable_name = 1;
  string description = 2;
  string depends_on_layer = 3;
  string depends_on_module = 4;
  string output_key = 5;
  bool required = 6;
}

// --- RPC: RegistryAdminService (Admin) ---

message RegisterModuleRequest {
  string git_source = 1;
  string module_path = 2;
  string version = 3;
  string provider = 4;
  string name = 5;
  string description = 6;
  // owner_team_id: team that owns this module (DB NOT NULL). The caller
  // must be a member of this team or an admin.
  string owner_team_id = 7;
}

message RegisterModuleResponse {
  Module module = 1;
}

message ListModulesRequest {
  aether.platform.v1.common.PageRequest pagination = 1;
  string provider_filter = 2;
  aether.platform.v1.common.ModuleStatus status_filter = 3;
}

message ListModulesResponse {
  repeated Module modules = 1;
  aether.platform.v1.common.PageResponse pagination = 2;
}

message GetModuleRequest {
  string module_id = 1;
}

message GetModuleResponse {
  Module module = 1;
}

message DeprecateModuleRequest {
  string module_id = 1;
  string version = 2;
  string reason = 3;
}

message DeprecateModuleResponse {
  Module module = 1;
}
