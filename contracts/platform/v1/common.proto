syntax = "proto3";

package aether.platform.v1;

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1;platformv1";

// ============================================================
// Shared types (reused across services).
// ============================================================

// PageRequest is embedded in list RPC requests for pagination.
message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// PageResponse is embedded in list RPC responses for pagination.
message PageResponse {
  string next_page_token = 1;
}

// Actor is the unified identity model (D10/D10.1).
message Actor {
  enum ActorType {
    ACTOR_TYPE_UNSPECIFIED = 0;
    ACTOR_TYPE_HUMAN = 1;
    ACTOR_TYPE_AI = 2;
    ACTOR_TYPE_SYSTEM = 3;
  }
  ActorType type = 1;
  string user_id = 2;
  string team_id = 3;
}

// ModuleVersion describes a registered Terraform module version.
message ModuleVersion {
  string version = 1;                       // semver e.g. v1.2.0
  string commit_sha = 2;                    // sha256:<hex>
  repeated string providers = 3;            // e.g. ["aws@>=5.0"]
  string variables_contract_json = 4;       // parsed from variables.tf
  repeated ModuleDependency dependencies = 5; // declared cross-module deps
  string registered_at = 6;
}

// ModuleDependency declares a cross-module dependency (from variables.tf).
// Example: ECS module depends on VPC module's vswitch_id output.
message ModuleDependency {
  string variable_name = 1;                 // e.g. "vswitch_id"
  string description = 2;                   // e.g. "VSwitch ID for the ECS instance"
  string depends_on_layer = 3;              // e.g. "global"
  string depends_on_module = 4;             // e.g. "vpc"
  string output_key = 5;                    // e.g. "vswitch_id"
  bool required = 6;                        // whether this dependency is mandatory
}
