syntax = "proto3";

package aether.platform.v1.common;

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/common;commonv1";

// ============================================================
// Platform error codes — the single source of truth for
// error-code identity. Split from enum.proto because the consumer
// is the error-handling package + all handlers, not domain models.
// ============================================================

// ErrorCode enumerates every platform error code — the single source of truth
// for error-code identity. The value name (minus the ERROR_CODE_ prefix) is the
// ErrorInfo reason clients match against. Transport semantics (gRPC Code,
// retryable, HTTP status) are supplied by the caller at the call site and
// derived from connect.Code per the gRPC standard; no separate behavior table
// is maintained (kratos-style: code identity in enum, behavior via Code).
// Adding a code: add the enum value here and run buf generate.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Validation
  ERROR_CODE_SCHEMA_INVALID = 1;
  ERROR_CODE_MODULE_VERSION_NOT_FOUND = 2;
  // Auth
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_PERMISSION_DENIED = 4;
  // Not Found
  ERROR_CODE_REQUEST_NOT_FOUND = 5;
  ERROR_CODE_CATALOG_ITEM_NOT_FOUND = 6;
  ERROR_CODE_ARTIFACT_NOT_FOUND = 7;
  // State / Conflict
  ERROR_CODE_STATE_CONFLICT = 8;
  ERROR_CODE_ILLEGAL_STATE_TRANSITION = 9;
  ERROR_CODE_IDEMPOTENCY_REPLAY = 10;
  // Rate Limiting
  ERROR_CODE_RATE_LIMITED = 11;
  // Business Rules
  ERROR_CODE_BUDGET_EXCEEDED = 12;
  ERROR_CODE_POLICY_VIOLATION = 13;
  ERROR_CODE_TAG_MISSING = 14;
  // Manual Intervention
  ERROR_CODE_MANUAL_INTERVENTION_REQUIRED = 15;
  // Platform Errors
  ERROR_CODE_PLATFORM_UNAVAILABLE = 16;
  ERROR_CODE_CLOUD_PROVIDER_ERROR = 17;
  ERROR_CODE_GIT_OPERATION_FAILED = 18;
  ERROR_CODE_TERRAMATE_EXECUTION_FAILED = 19;
  ERROR_CODE_INTERNAL_ERROR = 20;
}
