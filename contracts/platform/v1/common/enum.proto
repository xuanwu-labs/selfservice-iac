syntax = "proto3";

package aether.platform.v1.common;

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/common;commonv1";

// ============================================================
// Shared enums across all domains.
// ============================================================

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_HUMAN = 1;
  ACTOR_TYPE_AI = 2;
  ACTOR_TYPE_SYSTEM = 3;
}

enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  REQUEST_STATUS_SUBMITTED = 1;
  REQUEST_STATUS_GENERATING = 2;
  REQUEST_STATUS_PENDING_ADMISSION = 3;
  REQUEST_STATUS_PLANNING = 4;
  REQUEST_STATUS_PLAN_READY = 5;
  REQUEST_STATUS_PENDING_APPROVAL = 6;
  REQUEST_STATUS_APPLYING = 7;
  REQUEST_STATUS_RECONCILING = 8;
  REQUEST_STATUS_SUCCEEDED = 9;
  REQUEST_STATUS_REJECTED = 10;
  REQUEST_STATUS_CANCELLED = 11;
  REQUEST_STATUS_EXPIRED = 12;
  REQUEST_STATUS_FAILED_RETRYABLE = 13;
  REQUEST_STATUS_FAILED_TERMINAL = 14;
  REQUEST_STATUS_WAITING_MANUAL = 15;
  REQUEST_STATUS_RECONCILE_PENDING = 16;
  // Health/policy blocked states (doc 12a RLC-111/112/115, Phase 1 acceptance).
  // External-system-caused blocks that auto-resume on recovery (unlike
  // waiting_manual which needs human action).
  REQUEST_STATUS_BLOCKED_POLICY = 17;
  REQUEST_STATUS_BLOCKED_STATE_HEALTH = 18;
  REQUEST_STATUS_PAUSED_DRIFT = 19;
}

enum RequestSource {
  REQUEST_SOURCE_UNSPECIFIED = 0;
  REQUEST_SOURCE_WEB = 1;
  REQUEST_SOURCE_CLI = 2;
  REQUEST_SOURCE_CICD = 3;
  REQUEST_SOURCE_AI = 4;
  REQUEST_SOURCE_GATEWAY = 5;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVED = 1;
  APPROVAL_DECISION_REJECTED = 2;
}

enum ApprovalRunStatus {
  APPROVAL_RUN_STATUS_UNSPECIFIED = 0;
  APPROVAL_RUN_STATUS_PENDING = 1;
  APPROVAL_RUN_STATUS_APPROVED = 2;
  APPROVAL_RUN_STATUS_REJECTED = 3;
  APPROVAL_RUN_STATUS_EXPIRED = 4;
}

enum ArtifactStatus {
  ARTIFACT_STATUS_UNSPECIFIED = 0;
  ARTIFACT_STATUS_READY = 1;
  ARTIFACT_STATUS_EXPIRED = 2;
  ARTIFACT_STATUS_CONSUMED = 3;
  // Plan was superseded by a newer plan (drift guard re-plan, or approval
  // reject followed by re-plan). Kept for audit, not applyable (doc 12 §3.5).
  ARTIFACT_STATUS_SUPERSEDED = 4;
}

enum GateSeverity {
  GATE_SEVERITY_UNSPECIFIED = 0;
  GATE_SEVERITY_ERROR = 1;
  GATE_SEVERITY_WARNING = 2;
}

enum ModuleStatus {
  MODULE_STATUS_UNSPECIFIED = 0;
  MODULE_STATUS_PENDING_VALIDATION = 1;
  MODULE_STATUS_VALIDATED = 2;
  MODULE_STATUS_VALIDATION_FAILED = 3;
  MODULE_STATUS_DEPRECATED = 4;
}

enum CatalogItemStatus {
  CATALOG_ITEM_STATUS_UNSPECIFIED = 0;
  // Lifecycle: draft → active → deprecated → archived (doc 19 §1).
  // blocked = security/compliance/toolchain issue (doc 19 §1).
  CATALOG_ITEM_STATUS_DRAFT = 1;
  CATALOG_ITEM_STATUS_ACTIVE = 2;
  CATALOG_ITEM_STATUS_DEPRECATED = 3;
  CATALOG_ITEM_STATUS_ARCHIVED = 4;
  CATALOG_ITEM_STATUS_BLOCKED = 5;
}

enum Cardinality {
  CARDINALITY_UNSPECIFIED = 0;
  CARDINALITY_SINGLE = 1;
  CARDINALITY_LIST = 2;
  CARDINALITY_MAP = 3;
}

// StackGranularity is the D24 stack-grouping strategy declared on a
// catalog item. Determines how codegen partitions instances into stacks:
//   per-component = one stack per component (default, smallest blast radius)
//   per-space    = one stack per space (coarser, for tightly coupled sets)
//   per-team      = one stack per team (coarsest, rarely used)
//   custom        = path_template override (advanced, admin-only)
enum StackGranularity {
  STACK_GRANULARITY_UNSPECIFIED = 0;
  STACK_GRANULARITY_PER_COMPONENT = 1;
  STACK_GRANULARITY_PER_SPACE = 2;
  STACK_GRANULARITY_PER_TEAM = 3;
  STACK_GRANULARITY_CUSTOM = 4;
}

// StackMigrationStatus is the D26 Tier classification for a stack under a
// layer-rule-set version change. Drives the StateMover / sunset lifecycle.
enum StackMigrationStatus {
  STACK_MIGRATION_STATUS_UNSPECIFIED = 0;
  STACK_MIGRATION_STATUS_STABLE = 1;
  STACK_MIGRATION_STATUS_MIGRATION_PENDING = 2;
  STACK_MIGRATION_STATUS_MIGRATING = 3;
  STACK_MIGRATION_STATUS_DEPRECATED = 4;
}

// StackDependencyKind is the wiring type for a runtime cross-layer
// dependency (D29 after/watch). codegen renders the corresponding Terraform
// construct based on this value.
enum StackDependencyKind {
  STACK_DEPENDENCY_KIND_UNSPECIFIED = 0;
  STACK_DEPENDENCY_KIND_REMOTE_STATE = 1;
  STACK_DEPENDENCY_KIND_DATA_SOURCE = 2;
  STACK_DEPENDENCY_KIND_WATCH_ONLY = 3;
}

enum CloudProvider {
  CLOUD_PROVIDER_UNSPECIFIED = 0;
  CLOUD_PROVIDER_AWS = 1;
  CLOUD_PROVIDER_ALIYUN = 2;
  CLOUD_PROVIDER_AZURE = 3;
  CLOUD_PROVIDER_GCP = 4;
}

enum CloudAccountStatus {
  CLOUD_ACCOUNT_STATUS_UNSPECIFIED = 0;
  CLOUD_ACCOUNT_STATUS_ACTIVE = 1;
  CLOUD_ACCOUNT_STATUS_SUSPENDED = 2;
}

// ApprovalGate distinguishes the two mandatory review gates in the
// request lifecycle (D21): admission (pre-plan) and execution
// confirmation (pre-apply). See docs/12 §3.1.
enum ApprovalGate {
  APPROVAL_GATE_UNSPECIFIED = 0;
  APPROVAL_GATE_PRE_PLAN = 1;
  APPROVAL_GATE_PRE_APPLY = 2;
  // Retroactive approval for break-glass runs (D30). Marks a run created
  // after an emergency apply to satisfy the 24h retroactive-approval window.
  APPROVAL_GATE_BREAK_GLASS_RETROACTIVE = 3;
}

// ApprovalNodeMode is the decision semantics of an approval node, as
// declared in the approval flow DSL (docs/12 §2.3). The engine uses mode +
// required_count to determine if a node is satisfied:
//   any      = at least 1 approver (required_count ignored, treated as 1)
//   all      = all assigned approvers (required_count = total assignees)
//   majority = >50% of assignees (required_count = ceil(N/2))
//   quorum   = at least required_count approvers (count>=N expressed as quorum+N)
// Conditional routing (next_node based on outcome) is handled in the DSL,
// not in this enum — mode is purely the decision-aggregation rule.
enum ApprovalNodeMode {
  APPROVAL_NODE_MODE_UNSPECIFIED = 0;
  APPROVAL_NODE_MODE_ANY = 1;
  APPROVAL_NODE_MODE_ALL = 2;
  APPROVAL_NODE_MODE_MAJORITY = 3;
  APPROVAL_NODE_MODE_QUORUM = 4;
}

// ApprovalNodeStatus is the runtime status of a single approval node
// within a run (docs/04 §2.10 approval_node_runs.status).
enum ApprovalNodeStatus {
  APPROVAL_NODE_STATUS_UNSPECIFIED = 0;
  APPROVAL_NODE_STATUS_PENDING = 1;
  APPROVAL_NODE_STATUS_APPROVED = 2;
  APPROVAL_NODE_STATUS_REJECTED = 3;
  APPROVAL_NODE_STATUS_SKIPPED = 4;
  APPROVAL_NODE_STATUS_TIMEOUT = 5;
}
