syntax = "proto3";

package aether.platform.v1.common;

import "platform/v1/common/enum.proto";

option go_package = "github.com/xuanwu-labs/selfservice-iac/server/internal/proto/platform/v1/common;commonv1";

// ============================================================
// Shared messages across all domains.
// ============================================================

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}

message Actor {
  ActorType type = 1;
  string user_id = 2;
  string team_id = 3;
}
